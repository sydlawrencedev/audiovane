<head>

<meta property="og:description" content="Someone shared a Vibresia vibescape with you. Open it in Vibresia or download the app.">

<meta name="posthog-key" content="phc_pzYyxiM6u2pYa6FbCkRY8HPudHDopu5LrTwnoamHaeg2">
<meta name="posthog-host" content="https://us.i.posthog.com">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/media/share.jpg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="/share/share-page.css">
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 L7 16 L9 8 L13 24 L17 12 L21 20 L25 16 L29 16" stroke="#ff2bd6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    VIBRESIA
  </a>

  <section class="hero">
    <p class="eyebrow">A vibescape was shared with you</p>
    <h1>Your music. <span id="world-owner">Someone's world.</span></h1>
    <p class="lede" id="lede" hidden></p>
  </section>

  <div id="content">
    <!-- Populated by share-page.js once the URL has been parsed. -->
  </div>

  <p class="credit">Made with ❤ by <span id="credit-author">Minith Labs</span></p>
</div>

<script src="/analytics.js" defer></script>
<script src="/share/share-page.js"></script>
<script src="/share/preview.js"></script>
<script>
  /* Render the page once we know the URL. Two cases:
   *
   *   - No `?d=…` (someone hit /share directly) — treat as marketing: no
   *     custom payload, just the CTA to open or download Vibresia.
   *
   *   - `?d=…` is a base64-url payload. Decode the JSON here; if it parses,
   *     show the vibescape name and the shader source as a preview. The
   *     opening dance is the same as for built-ins.
   */
  (function () {
    var params = new URL(window.location.href).searchParams;
    var d = params.get("d");
    var content = document.getElementById("content");
    var lede = document.getElementById("lede");
    var creditAuthor = document.getElementById("credit-author");
    var worldOwner = document.getElementById("world-owner");

    if (!d) {
      content.innerHTML = noPayloadContent();
      return;
    }

    var payload;
    try {
      payload = decodePayload(d);
    } catch (e) {
      content.innerHTML = errorCard("Couldn't read this share link. Ask the sender to resend it — the URL may have been truncated.");
      return;
    }

    lede.hidden = false;
    lede.textContent = (payload.author
      ? "A vibescape called “" + payload.name + "” by " + payload.author + "."
      : "A vibescape called “" + payload.name + "”.");
    document.title = payload.name + " — Vibresia";
    creditAuthor.textContent = payload.author || "Minith Labs";
    // The headline names the person who made it, when the link says who they
    // are. textContent, not innerHTML: the payload comes out of the URL, so
    // the author is whatever the sender typed.
    if (payload.author) worldOwner.textContent = possessive(payload.author) + " world.";

    content.innerHTML =
      '<div class="shot" id="shot" hidden>' +
        '<canvas id="shot-canvas" width="1200" height="630" ' +
          'role="img" aria-label="This vibescape, drawn"></canvas>' +
      '</div>' +
      '<div class="cta-row">' +
        '<a class="btn primary" href="#" data-share-open data-share-custom>Open in Vibresia</a>' +
        '<a class="btn coffee" href="/download?src=share_fallback" data-share-download hidden>Download for Mac</a>' +
      '</div>' +
      '<p class="share-cta"><small>Press <strong>Open in Vibresia</strong> to add it to your list. You’ll need the Mac app — free, no account.</small></p>' +
      // The shader last. Someone sent you this vibescape and you want to open
      // it; the source is the interesting bit after that, not the thing being
      // asked for. It was above the button, which put a wall of code between the
      // reader and the one action the page exists to offer.
      '<div class="code-preview">' +
        '<header><span>The shader</span>' +
          '<button type="button" class="copy" data-copy-shader>Copy</button></header>' +
        '<pre><code></code></pre>' +
      '</div>';

    content.querySelector("code").textContent = payload.shader;
    wireCopyButton(content.querySelector("[data-copy-shader]"));
    drawShot(payload);
  })();

  /* Draws the vibescape into the picture slot.
   *
   * The still is drawn first either way — that's the image the page has even
   * if it never moves, and the one that ends up in a screenshot. Animation is
   * then added on top, unless the visitor has asked for reduced motion.
   *
   * Best effort by design. No WebGL, a shader the browser's driver dislikes, a
   * canvas the browser refuses to give us — any of those and the picture is
   * simply absent, because someone opened a link to see a vibescape and not to
   * debug one. The link, the name and the source are all still there.
   */
  function drawShot(payload) {
    var wrap = document.getElementById("shot");
    var canvas = document.getElementById("shot-canvas");
    if (!wrap || !canvas || !window.vibresiaPreview) return;
    // The canvas carries the vibescape's name, which is from the URL.
    canvas.setAttribute("aria-label", "“" + payload.name + "”, drawn by Vibresia");

    var reduce = window.matchMedia
      && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var result;
    try {
      result = window.vibresiaPreview.animate(payload.shader, canvas,
                                             { animate: !reduce });
    } catch (e) {
      return; // a thrown preview is still just a missing picture
    }
    if (result && result.ok) wrap.hidden = false;
  }

  /* Copies the shader, and says so.
   *
   * Falls back to selecting the text when the clipboard API isn't there. It
   * needs a secure context, so a page opened over plain http from someone's
   * server rather than localhost has no navigator.clipboard — and a copy
   * button that silently does nothing is worse than one that leaves the text
   * selected for a manual ⌘C.
   */
  function wireCopyButton(button) {
    if (!button) return;
    var code = button.parentElement.parentElement.querySelector("code");
    if (!code) return;
    button.addEventListener("click", function () {
      var text = code.textContent;
      var flash = function (label, done) {
        button.textContent = label;
        if (done) button.setAttribute("data-done", "");
        setTimeout(function () {
          button.textContent = "Copy";
          button.removeAttribute("data-done");
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          flash("Copied", true);
        }, function () {
          select(code);
          flash("Press ⌘C");
        });
      } else {
        select(code);
        flash("Press ⌘C");
      }
    });
    function select(node) {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  /* "Alisan's world", but "Chris' world" rather than "Chris's". */
  function possessive(name) {
    var n = name.trim();
    if (!n) return "";
    return /s$/i.test(n) ? n + "'" : n + "'s";
  }

  // Mirror of SharePayload on the Swift side (Sources/VisualiserMac/Share/ShareImporter.swift).
  function decodePayload(s) {

    var t = s.replace(/-/g, "+").replace(/_/g, "/");
    while (t.length % 4 !== 0) t += "=";
    var json = decodeURIComponent(escape(atob(t)));
    var obj = JSON.parse(json);
    if (!obj.name || !obj.shader) throw new Error("missing name or shader");
    return obj;
  }

  function noPayloadContent() {
    return '' +
      '<div class="cta-row">' +
        '<a class="btn primary" href="/">See Vibresia</a>' +
      '</div>' +
      '<p class="share-cta"><small>This is the page Vibresia lands on when someone sends you a vibescape link. The link should look like <code>https://vibresia.com/share?d=…</code>.</small></p>';
  }

  function errorCard(msg) {
    return '<div class="error-card">' + msg + '</div>';
  }
</script>
</body>
</html>

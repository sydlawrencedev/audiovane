# Landing page for https://vibresia.com — static files in ./site, served by
# a Cloudflare Worker.
#   npx wrangler deploy
#
# The Worker exists for one route: /download, which redirects to the latest
# GitHub release and tells Discord about it (see worker/index.js). Everything
# else is served straight from ./site, including its _headers and _redirects.
name = "vibresia"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./site"
binding = "ASSETS"
# The Worker has to see every request, not just the ones that miss a file:
# the redirects from the old hostname and from www are decided here, and an
# asset hit served straight from the edge would skip them.
run_worker_first = true

[vars]
# Plain settings; the webhook URL is a secret, never a var:
#   npx wrangler secret put DISCORD_WEBHOOK_URL
DISCORD_NOTIFICATIONS_ENABLED = "true"
DISCORD_BOT_USERNAME = "Vibresia"

# Shared vibescapes. The app POSTs a custom vibescape here — the shader
# payload and a picture of it — and gets back a short URL on this domain
# (/s/<id>) that the site serves with the payload inlined and a real og:image.
#
# D1 rather than Workers KV because KV is eventually consistent: a link
# opened ten seconds after it was shared could hit an edge that has not seen
# the write and 404. D1 is SQLite-backed and strongly consistent, so the link
# works the moment it exists.
#
#   npx wrangler d1 migrations apply vibresia-shares --remote
[[d1_databases]]
binding = "SHARES"
database_name = "vibresia-shares"
database_id = "df8952d8-d6d0-4bd5-91cb-19f6ba97adae"

# These are routes rather than custom domains because the DNS for
# vibresia.com already exists and is proxied. A custom domain would want to
# own those records, and Cloudflare refuses to overwrite records it didn't
# create.
#
# The old hostname is attached too, so the Worker can answer it with a
# permanent redirect to the new one — the old install command and any old
# link in someone's post keep working. Its DNS has to keep pointing at
# Cloudflare for that to happen.
[[routes]]
pattern = "vibresia.com/*"
zone_name = "vibresia.com"

[[routes]]
pattern = "www.vibresia.com/*"
zone_name = "vibresia.com"

# The old name, as a custom domain rather than a route: a custom domain
# outranks the Pages project that also answers for this hostname, which is
# what was serving the company site on the bare "/" instead of redirecting.
[[routes]]
pattern = "audiovane.minithlabs.com"
custom_domain = true

